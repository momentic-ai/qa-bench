name: Hugging Face sync

# Run manually from main, or from a v* tag at main's head to also tag the dataset.
on:
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged for a short-lived Hugging Face token (Trusted Publishers).
  id-token: write

# Serialize syncs so an older commit never overwrites a newer one.
concurrency:
  group: huggingface-sync
  cancel-in-progress: false

jobs:
  sync:
    # Runs from other branches must not publish their contents.
    if: >-
      github.repository == 'momentic-ai/qa-bench' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    env:
      HF_REPO: momentic/qa-bench
      HF_OIDC_RESOURCE: datasets/momentic/qa-bench
    steps:
      - uses: actions/checkout@v4
      # A tag uploads its tree to Hugging Face main, so it must not roll back newer data.
      - name: Require tag at main
        if: github.ref_type == 'tag'
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must point at the head of main."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.4.0
      # The dataset root holds the app folders, with the card as README.md.
      - name: Stage dataset
        run: |
          mkdir dataset
          cp -R fixtures/web/oss/. dataset/
          cp DATASET_CARD.md dataset/README.md
      # The card's configs point the Dataset Viewer at these tables; the JSON stays the source.
      - name: Build viewer tables
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path("dataset")
          out = root / "data"
          out.mkdir()
          tables = {"areas": [], "bugs": [], "known_invalid": []}
          story = ["name", "summary", "expected", "actual", "reproSteps"]
          for area_dir in sorted(root.glob("*/areas/*")):
              app, area = area_dir.parts[1], area_dir.name
              brief = json.loads((area_dir / "fixture.json").read_text())["productArea"]
              bugs = json.loads((area_dir / "ground-truth.json").read_text())["bugs"]
              invalid = json.loads((area_dir / "known-invalid.json").read_text())["bugs"]
              tables["areas"].append({
                  "app": app,
                  "area": area,
                  "name": brief["name"],
                  "scope": brief["scope"],
                  "entryPoints": brief["entryPoints"],
                  "testResponsiveness": brief.get("testResponsiveness", False),
                  "bugs": len(bugs),
                  "knownInvalid": len(invalid),
              })
              def cases(steps):
                  # Labels may hold one list of steps or a list of cases; the viewer gets cases.
                  return steps if steps and isinstance(steps[0], list) else [steps]

              for bug in bugs:
                  row = {"app": app, "area": area, **{k: bug.get(k) for k in story}}
                  row["reproSteps"] = cases(row["reproSteps"])
                  tables["bugs"].append({**row, "severity": bug["severity"]})
              for bug in invalid:
                  row = {"app": app, "area": area, **{k: bug.get(k) for k in story}}
                  row["reproSteps"] = cases(row["reproSteps"])
                  tables["known_invalid"].append({**row, "reason": bug["reason"]})
          for name, rows in tables.items():
              with open(out / f"{name}.jsonl", "w") as f:
                  f.writelines(json.dumps(row) + "\n" for row in rows)
      - name: Upload and tag
        shell: python
        run: |
          import os
          from huggingface_hub import HfApi

          api = HfApi()
          repo = os.environ["HF_REPO"]
          sha = os.environ["GITHUB_SHA"]
          commit = api.upload_folder(
              repo_id=repo,
              repo_type="dataset",
              folder_path="dataset",
              # Remove files deleted on GitHub; .gitattributes is always kept.
              delete_patterns="*",
              commit_message=f"Sync momentic-ai/qa-bench@{sha[:7]}",
              commit_description=f"https://github.com/momentic-ai/qa-bench/commit/{sha}",
          )
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              api.create_tag(
                  repo,
                  repo_type="dataset",
                  tag=os.environ["GITHUB_REF_NAME"],
                  revision=commit.oid,
              )
