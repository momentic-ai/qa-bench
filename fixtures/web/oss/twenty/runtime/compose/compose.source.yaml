x-source-build: &source-build
  context: ../../source
  dockerfile: packages/twenty-docker/twenty/Dockerfile
  target: twenty
  args:
    REACT_APP_SERVER_BASE_URL: ${FIXTURE_URL:?Use the public preview URL}

services:
  server:
    image: ${FIXTURE_IMAGE:?Source runs require their own image}
    build: *source-build
  migrate:
    image: ${FIXTURE_IMAGE:?Source runs require their own image}
    build: *source-build
  seed:
    image: ${FIXTURE_IMAGE:?Source runs require their own image}
    build: *source-build
  worker:
    image: ${FIXTURE_IMAGE:?Source runs require their own image}
    build: *source-build
