name: diy-mo-metabase

services:
  metabase:
    image: metabase/metabase:v0.58.24@sha256:b3e1f30b8d2d1999aee94182bafb6c56819bc596c4086cc879120687887ce471
    ports:
      - "${FIXTURE_PORT:-5501}:3000"
    environment:
      MB_JETTY_PORT: 3000
      MB_DB_TYPE: h2
      MB_DB_FILE: /tmp/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_SITE_URL: ${FIXTURE_URL:-http://localhost:5501/}
    depends_on:
      seed-data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  seed-data:
    image: postgres:16.10-alpine@sha256:ab8380566c3ea09690a9ecaa85a59d82bfc6eb86744151a2a54335866c83a3e9
    entrypoint:
      - psql
      - --host=db
      - --username=postgres
      - --dbname=release_operations
      - --set=ON_ERROR_STOP=1
      - --file
      - /fixture/sample-data.sql
    environment:
      PGPASSWORD: fixture-database-1
    volumes:
      - ../data/sample-data.sql:/fixture/sample-data.sql:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.10-alpine@sha256:ab8380566c3ea09690a9ecaa85a59d82bfc6eb86744151a2a54335866c83a3e9
    environment:
      POSTGRES_DB: release_operations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fixture-database-1
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "release_operations"]
      interval: 3s
      timeout: 3s
      retries: 60

  seed:
    image: node:24.18.1-alpine@sha256:f70403e87646dc51b45295f4b8b70cdad0b63d2297c4c9899119b03f7af7a6b3
    command: ["node", "${FIXTURE_SEED_SCRIPT:-/fixture/app/seed.mjs}"]
    environment:
      FIXTURE_USERNAME: ${FIXTURE_USERNAME:-eval@momentic.ai}
      FIXTURE_PASSWORD: ${FIXTURE_PASSWORD:-momentic-eval-1}
    volumes:
      - ..:/fixture/app:ro
    depends_on:
      metabase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/setup-complete"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  db-data:
