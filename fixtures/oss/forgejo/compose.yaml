name: diy-mo-forgejo

services:
  forgejo:
    image: kleen/forgejo:16.0.5@sha256:5effb7305584aca479b29fde6f9631a6dbe86ae798ae02eeea33a3666f0c0bf8
    environment:
      FORGEJO__server__DOMAIN: ${FIXTURE_HOST:-localhost}
      FORGEJO__server__ROOT_URL: ${FIXTURE_URL:-http://localhost:5503/}
      FORGEJO__server__HTTP_ADDR: 0.0.0.0
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__log__LEVEL: warn
    ports:
      - "5503:3000"
    volumes:
      - forgejo-data:/var/lib/gitea
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:3000/api/healthz",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  seed:
    image: kleen/forgejo:16.0.5@sha256:5effb7305584aca479b29fde6f9631a6dbe86ae798ae02eeea33a3666f0c0bf8
    entrypoint: ["/bin/sh", "${FIXTURE_SEED_SCRIPT:-/fixture/app/seed.sh}"]
    environment:
      FORGEJO__server__DOMAIN: ${FIXTURE_HOST:-localhost}
      FORGEJO__server__ROOT_URL: ${FIXTURE_URL:-http://localhost:5503/}
      FORGEJO__server__HTTP_ADDR: 0.0.0.0
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__log__LEVEL: warn
    volumes:
      - forgejo-data:/var/lib/gitea
      - ..:/fixture/app:ro
    depends_on:
      forgejo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bootstrap-complete"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  forgejo-data:
