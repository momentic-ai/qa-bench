name: diy-mo-saleor

services:
  db:
    image: postgres:15.12-alpine@sha256:ef9d1517df69c4d27dbb9ddcec14f431a2442628603f4e9daa429b92ae6c3cd1
    environment:
      POSTGRES_USER: saleor
      POSTGRES_PASSWORD: saleor
      POSTGRES_DB: saleor
    volumes:
      - saleor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor -d saleor"]
      interval: 5s
      timeout: 5s
      retries: 30

  cache:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.9@sha256:b004cc0672d0692f097ba8ab9e5956ae08eeafee3d0a6bf2ab239750101ac538
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30

  seed:
    image: ghcr.io/saleor/saleor:3.23@sha256:3fed0d65bb93644ff5a3b8d2014ce3d9512b46dbbbcb540133efc1d69ebe6426
    entrypoint: ["/bin/sh", "${FIXTURE_SEED_SCRIPT:-/fixture/app/seed.sh}"]
    environment: &saleor-environment
      CACHE_URL: redis://cache:6379/0
      CELERY_BROKER_URL: redis://cache:6379/1
      DATABASE_URL: postgres://saleor:saleor@db/saleor
      DEFAULT_CHANNEL_SLUG: default-channel
      DEFAULT_FROM_EMAIL: noreply@example.com
      EMAIL_URL: smtp://mailpit:1025
      SECRET_KEY: diy-mo-saleor-fixture-secret-key
      PUBLIC_URL: ${FIXTURE_URL:-http://localhost:5503/}
      OTEL_SERVICE_NAME: saleor
      OTEL_TRACES_EXPORTER: none
      DASHBOARD_URL: ${FIXTURE_URL:-http://localhost:5503/}
      ALLOWED_HOSTS: ${FIXTURE_HOST:-localhost},api,localhost
      CSRF_TRUSTED_ORIGINS: https://${FIXTURE_HOST:-localhost}
    volumes:
      - ..:/fixture/app:ro
      - saleor-media:/app/media
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/saleor-setup-complete"]
      interval: 2s
      timeout: 2s
      retries: 300
      start_period: 5s

  api:
    image: ghcr.io/saleor/saleor:3.23@sha256:3fed0d65bb93644ff5a3b8d2014ce3d9512b46dbbbcb540133efc1d69ebe6426
    environment: *saleor-environment
    volumes:
      - saleor-media:/app/media
    depends_on:
      seed:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import socket; s=socket.create_connection((''127.0.0.1'',8000),timeout=4); s.close()"',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  worker:
    image: ghcr.io/saleor/saleor:3.23@sha256:3fed0d65bb93644ff5a3b8d2014ce3d9512b46dbbbcb540133efc1d69ebe6426
    command:
      [
        "celery",
        "-A",
        "saleor",
        "--app=saleor.celeryconf:app",
        "worker",
        "--loglevel=info",
        "--concurrency=1",
        "-B",
      ]
    environment: *saleor-environment
    volumes:
      - saleor-media:/app/media
    depends_on:
      seed:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  dashboard:
    image: ghcr.io/saleor/saleor-dashboard:3.23@sha256:d78534abab292432c8c150b713630f1117bd2e92eb3460962355fb8be3dab267
    environment:
      API_URL: ${FIXTURE_URL:-http://localhost:5503/}graphql/
      APP_MOUNT_URI: /
      LOCALE_CODE: EN
    volumes:
      - ../data/dashboard-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 30

  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "5503:80"
    volumes:
      - ../data/dashboard-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../data/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      FIXTURE_HOST: ${FIXTURE_HOST:-localhost}
    depends_on:
      dashboard:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  saleor-db:
  saleor-media:
